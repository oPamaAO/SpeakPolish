# Голосовой ввод для opencode — настройки
# Путь: ~/.config/opencode/voice/config.yaml

stt:
  model: large-v3-turbo        # 809M — на CPU считает short-диктовки за секунды
  device: cuda                   # cuda — штатно (cuBLAS ставится через pip, voice.py сам прописывает DLL).
                               # cpu — запасной (скрипт упадёт на него сам при любой ошибке CUDA).
  compute_type: float16        # float16 для CUDA на 1660S (нет тензорных ядер — int8 на GPU не годится).
                               # Для CPU скрипт всё равно использует int8.
  language: null               # null = автоопределение RU/EN на чанк 30 сек
  vad_filter: true             # резать тишину (Silero VAD), абзацы по паузам — частично
  beam_size: 5
  # Порог тишины для анти-галлюцинаций Whisper. ОТКЛЮЧЁН (null): подозревался в
  # вырезании середины продолжений (баг №1) — остались три других слоя защиты:
  # обрезка тишины по энергии, чёрный список фраз, фильтр повторов.
  hallucination_silence_threshold: null
  # Нейтральный промпт: только стиль, БЕЗ терминов (термины — в terminology.yaml,
  # иначе Whisper подтягивает каждое второе слово под словарь и галлюцинирует)
  initial_prompt: "Это голосовая диктовка программиста. Русский язык с английскими IT-терминами. Расставь знаки препинания."

audio:
  samplerate: 16000            # Whisper ест 16k mono
  channels: 1
  # device: подстрока имени микрофона (показывается при старте скрипта).
  # null = системный по умолчанию. Пример: "WASAPI" или "Realtek".
  device: null

draft:
  path: "draft.txt"            # буфер-черновик рядом со скриптом, режим append
  separator: "\n\n"            # каждый кусок — с новой строки (абзацем): видно полноту, удобно править

polish:
  agent: "prompt-polisher"
  model: "opencode/muse-spark-1.3-contributor-free"
  # команда: opencode run --agent prompt-polisher -m <model>
  # mode: replace = выделить всё в поле ввода (Home, Shift+End) и ЗАМЕНИТЬ;
  #       append = вставить после существующего текста. Нужен фокус в поле ввода.
  mode: replace

hotkeys:
  record_toggle: "F9"          # нажал — запись, нажал ещё раз — стоп, кусок ДОПИСАЛСЯ
  append: "shift+F9"           # то же самое, явное «продолжить» (алиас record_toggle)
  clear: "ctrl+F9"             # очистить черновик, начать заново
  polish: "ctrl+shift+space"   # отполировать черновик диктовки через opencode run
  polish_clipboard: "F10"      # отполировать текст из БУФЕРА ОБМЕНА (для ручного текста без диктовки)

paths:
  terminology: "terminology.yaml"

filter:
  # Типовые выдумки Whisper на тишине/шуме — вырезаются из результата целиком
  # вместе с предложением. Дополняй, если вылезет новая (регистр не важен).
  hallucinated_phrases:
    - "спокойная музыка"
    - "спасибо за просмотр"
    - "подписывайтесь на канал"
    - "продолжение следует"
    - "спасибо за внимание"
